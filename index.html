<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalla Musical</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="parte principal">

        <div class="btn-inicio-sesion">

            <button class="btn-sesion">inicio de sesion</button>

            <button class="btn-registro">Registro</button>

        </div>


        <div class="logoprincipal">

            <img class="imagenlogo" src="Imágenes/rayo.png" alt="rayo">

            <h1 class="logo">

                BATALLA MUSICAL

            </h1>

            <img class="imagenlogo" src="Imágenes/rayo.png" alt="rayo">

        </div>

        <nav>

            <a href="">
                <h3>Generos</h3>
            </a>

            <a href="">
                <h3>Batallas pasadas</h3>
            </a>

            <a href="">
                <h3>Eventos</h3>
            </a>

            <a href="">
                <h3>Patrocinadores</h3>
            </a>

            <a href="">
                <h3>Inscripciones</h3>
            </a>

        </nav>

    </header>

    <section class="votaciones">

        <h2 class="tituñp votaciones">Votaciones</h2>

        <img src="Imágenes/banda-1.jpg" alt="" class="bandas">

        <img src="Imágenes/banda-2.jpg" alt="" class="bandas">

        <button class="votar">Votar</button>

        <button class="votar">Votar</button>


    </section>


    <section class="filtros-musica">

        <!-- Filtro por Género (Casillas de verificación para seleccionar múltiples) -->

        <div class="filtro-grupo">

            <span class="filtro-titulo">Géneros</span>

            <label><input type="checkbox" name="genero" value="clasico"> Clásico</label>

            <label><input type="checkbox" name="genero" value="rock"> Rock</label>

            <label><input type="checkbox" name="genero" value="jazz"> Jazz</label>

            <label><input type="checkbox" name="genero" value="pop"> Pop</label>

        </div>

        <!-- Filtro por Época (Casillas de verificación para seleccionar múltiples) -->
        <div class="filtro-grupo">

            <span class="filtro-titulo">Época</span>

            <label><input type="checkbox" name="epoca" value="80s"> Años 80</label>

            <label><input type="checkbox" name="epoca" value="90s"> Años 90</label>

            <label><input type="checkbox" name="epoca" value="2000s"> Años 2000</label>

        </div>

        <div class="filtrar">

            <button class="filtrar">Filtrar</button>

        </div>

    </section>





    <script src="script.js"></script>
</body>

</html>
